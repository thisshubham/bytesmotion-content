<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ambient lighting -->
<div class="amb" aria-hidden="true">
  <i class="b1"></i><i class="b2"></i><i class="b3"></i>
</div>

<div class="stage">

  <!-- segmented ring (segments injected by script.js) -->
  <div class="ring" aria-hidden="true"><div class="boost" id="boost"></div></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <div class="card" id="card">

    <!-- ─────────── SCENE 1 · LOGIN ─────────── -->
    <form class="panel login" id="p-login" data-state="idle" autocomplete="off" onsubmit="return false">

      <h1 style="--i:0">Login</h1>

      <div class="field" style="--fd:0s;--i:1">
        <input type="email" placeholder="Email" aria-label="Email">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </div>

      <div class="field" style="--fd:1.1s;--i:2">
        <input type="password" id="pw" placeholder="Password" aria-label="Password">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>

      <div class="forgot" style="--i:3">
        <span>Forgot your password</span>
        <button type="button" class="eye" data-target="pw" aria-label="Show password" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.8 12S5.6 5.4 12 5.4 22.2 12 22.2 12 18.4 18.6 12 18.6 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/>
          </svg>
        </button>
      </div>

      <button class="cta" type="submit" style="--i:4">
        <span>LOGIN</span><i class="notch"></i><i class="sheen"></i>
      </button>

      <p class="with" style="--i:5">log in with</p>

      <div class="socials" style="--i:6">
        <a href="#" style="--sd:0s" aria-label="Log in with Facebook">
          <svg width="21" height="21" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#1877F2"/><path d="M15.6 12.6h-2.3V20h-3v-7.4H8.6V10h1.7V8.5c0-2.1 1.1-3.3 3.3-3.3h2v2.7h-1.3c-.5 0-.9.2-.9.9V10h2.4l-.2 2.6Z" fill="#fff"/></svg>
        </a>
        <a href="#" style="--sd:.18s" aria-label="Log in with X">
          <svg width="21" height="21" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0d0d0d"/><path d="M16.9 5h2.5l-5.5 6.3L20.4 20h-5l-3.6-4.7L7.6 20H5.1l5.9-6.7L4.9 5h5.1l3.3 4.3L16.9 5Zm-.9 13.5h1.4L9 6.4H7.5l8.5 12.1Z" fill="#fff"/></svg>
        </a>
        <a href="#" style="--sd:.36s" aria-label="Log in with Google">
          <svg width="21" height="21" viewBox="0 0 24 24"><path d="M21.6 12.23c0-.68-.06-1.34-.18-1.98H12v3.74h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.74 2.98-4.3 2.98-7.28Z" fill="#4285F4"/><path d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.24-2.5c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.75-5.6-4.11H3.06v2.58A10 10 0 0 0 12 22Z" fill="#34A853"/><path d="M6.4 13.92a5.99 5.99 0 0 1 0-3.84V7.5H3.06a10 10 0 0 0 0 9l3.34-2.58Z" fill="#FBBC05"/><path d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.95 2.98 14.7 2 12 2a10 10 0 0 0-8.94 5.5L6.4 10.08c.8-2.36 3-4.1 5.6-4.1Z" fill="#EA4335"/></svg>
        </a>
      </div>

      <div class="foot" style="--i:7">
        <button type="button" class="swap" data-go="signup">Sign Up</button>
      </div>
    </form>

    <!-- ─────────── SCENE 2 · SIGN UP ─────────── -->
    <form class="panel signup" id="p-signup" data-state="hidden" inert autocomplete="off" onsubmit="return false">

      <h1 style="--i:0">Sign Up</h1>

      <div class="field" style="--fd:0s;--i:1">
        <input type="text" placeholder="Full Name" aria-label="Full name">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </div>

      <div class="field" style="--fd:.55s;--i:2">
        <input type="email" placeholder="Email" aria-label="Email">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </div>

      <div class="field" style="--fd:1.1s;--i:3">
        <input type="password" id="pw2" placeholder="Password" aria-label="Password">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>

      <div class="field" style="--fd:1.65s;--i:4">
        <input type="password" id="pw3" placeholder="Confirm Password" aria-label="Confirm password">
        <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="m9.4 15.6 1.8 1.8 3.4-3.4"/>
        </svg>
      </div>

      <button class="cta" type="submit" style="--i:5">
        <span>SIGN UP</span><i class="notch"></i><i class="sheen"></i>
      </button>

      <p class="with" style="--i:6">sign up with</p>

      <div class="socials" style="--i:7">
        <a href="#" style="--sd:0s" aria-label="Sign up with Facebook">
          <svg width="21" height="21" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#1877F2"/><path d="M15.6 12.6h-2.3V20h-3v-7.4H8.6V10h1.7V8.5c0-2.1 1.1-3.3 3.3-3.3h2v2.7h-1.3c-.5 0-.9.2-.9.9V10h2.4l-.2 2.6Z" fill="#fff"/></svg>
        </a>
        <a href="#" style="--sd:.18s" aria-label="Sign up with X">
          <svg width="21" height="21" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0d0d0d"/><path d="M16.9 5h2.5l-5.5 6.3L20.4 20h-5l-3.6-4.7L7.6 20H5.1l5.9-6.7L4.9 5h5.1l3.3 4.3L16.9 5Zm-.9 13.5h1.4L9 6.4H7.5l8.5 12.1Z" fill="#fff"/></svg>
        </a>
        <a href="#" style="--sd:.36s" aria-label="Sign up with Google">
          <svg width="21" height="21" viewBox="0 0 24 24"><path d="M21.6 12.23c0-.68-.06-1.34-.18-1.98H12v3.74h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.74 2.98-4.3 2.98-7.28Z" fill="#4285F4"/><path d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.24-2.5c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.75-5.6-4.11H3.06v2.58A10 10 0 0 0 12 22Z" fill="#34A853"/><path d="M6.4 13.92a5.99 5.99 0 0 1 0-3.84V7.5H3.06a10 10 0 0 0 0 9l3.34-2.58Z" fill="#FBBC05"/><path d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.95 2.98 14.7 2 12 2a10 10 0 0 0-8.94 5.5L6.4 10.08c.8-2.36 3-4.1 5.6-4.1Z" fill="#EA4335"/></svg>
        </a>
      </div>

      <div class="foot" style="--i:8">
        <span>Already have an account?</span>
        <button type="button" class="swap" data-go="login">Login</button>
      </div>
    </form>

  </div>
</div>

<div class="vignette" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
